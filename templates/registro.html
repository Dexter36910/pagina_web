
<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Yolistli</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="{% static 'css/estilos.css' %}">

</head>
<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
            href="{% url 'inicio' %}">

            <img src="{% static 'imagenes/logo.jpeg' %}"
                class="logo-img">

            <span class="ms-3 titulo-logo">
                YOLISTLI
            </span>

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                        href="{% url 'inicio' %}">

                        Inicio

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link active"
                        href="{% url 'registro' %}">

                        Registro

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                        href="{% url 'noticias' %}">

                        Noticias

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                        href="{% url 'login' %}">

                        Login

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- ================= REGISTRO ================= -->

<section class="registro-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="registro-card">

                    <div class="text-center mb-4">

                        <img src="{% static 'imagenes/logo.jpeg' %}"
                            class="login-logo">

                        <h1 class="registro-title">

                            Crear Cuenta

                        </h1>

                        <p class="registro-subtitle">

                            Regístrate para comenzar
                            tu aventura en Yolistli.

                        </p>

                    </div>

                    <!-- FORMULARIO -->

                    <form method="POST">
                        {% csrf_token %}

                        <!-- USUARIO -->

                        <div class="mb-3">

                            <label class="form-label">

                                Usuario

                            </label>

                            <input type="text"
                                class="form-control"
                                id="usuario"
                                name="usuario">

                            <small id="mensajeUsuario"></small>

                        </div>

                        <!-- EDAD -->

                        <div class="mb-3">

                            <label class="form-label">

                                Edad

                            </label>

                            <input type="number"
                                class="form-control"
                                id="edad"
                                name="edad">

                            <small id="mensajeEdad"></small>

                        </div>

                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">

                                Contraseña

                            </label>

                            <input type="password"
                                class="form-control"
                                id="password"
                                name="password">

                            <small id="mensajePassword"></small>

                        </div>

                        <!-- OPINIÓN -->

                        <div class="mb-4">

                            <label class="form-label">

                                Opinión sobre Yolistli

                            </label>

                            <textarea class="form-control"
                                id="opinion"
                                name="opinion"></textarea>

                        </div>

                        <!-- BOTÓN -->

                        <div class="d-grid">

                            <button class="btn btn-success btn-lg">

                                Registrarse

                            </button>

                        </div>

                    </form>

                    <div class="text-center mt-4">

                        <a href="{% url 'login' %}"
                           class="btn btn-outline-light">

                            Ya tengo cuenta

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container text-center">

        <h4>YOLISTLI</h4>

        <p>
            Proyecto desarrollado por CORNDEV
        </p>

    </div>

</footer>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= JAVASCRIPT ================= -->

<script>


// ================= ADMIN =================

if(usuarios.length === 0){

    usuarios.push({

        usuario:"admin",

        edad:"20",

        password:"admin123",

        opinion:"Administrador",

        rol:"admin"

    });

    localStorage.setItem(
        "usuarios",
        JSON.stringify(usuarios)
    );

}

// ================= ELEMENTOS =================

const usuario =
document.getElementById("usuario");

const edad =
document.getElementById("edad");

const password =
document.getElementById("password");

const opinion =
document.getElementById("opinion");

// ================= VALIDACIÓN USUARIO =================

usuario.addEventListener("input", ()=>{

    if(usuario.value.length >= 4){

        document.getElementById("mensajeUsuario")
        .innerHTML = "Usuario válido";

        document.getElementById("mensajeUsuario")
        .style.color = "#7CFC00";

    }else{

        document.getElementById("mensajeUsuario")
        .innerHTML =
        "Mínimo 4 caracteres";

        document.getElementById("mensajeUsuario")
        .style.color = "#ff6b6b";

    }

});

// ================= VALIDACIÓN EDAD =================

edad.addEventListener("input", ()=>{

    if(edad.value >= 12){

        document.getElementById("mensajeEdad")
        .innerHTML = "Edad válida";

        document.getElementById("mensajeEdad")
        .style.color = "#7CFC00";

    }else{

        document.getElementById("mensajeEdad")
        .innerHTML =
        "Debes tener mínimo 12 años";

        document.getElementById("mensajeEdad")
        .style.color = "#ff6b6b";

    }

});

// ================= VALIDACIÓN PASSWORD =================

password.addEventListener("input", ()=>{

    if(password.value.length >= 6){

        document.getElementById("mensajePassword")
        .innerHTML =
        "Contraseña segura";

        document.getElementById("mensajePassword")
        .style.color = "#7CFC00";

    }else{

        document.getElementById("mensajePassword")
        .innerHTML =
        "Mínimo 6 caracteres";

        document.getElementById("mensajePassword")
        .style.color = "#ff6b6b";

    }

});

// ================= REGISTRO =================
    // VALIDACIONES

    if(
        usuario.value === ""
        ||
        edad.value === ""
        ||
        password.value === ""
    ){

        alert(
        "Completa todos los campos"
        );

        return;

    }

    if(usuario.value.length < 4){

        alert(
        "Usuario inválido"
        );

        return;

    }

    if(edad.value < 12){

        alert(
        "Edad inválida"
        );

        return;

    }

    if(password.value.length < 6){

        alert(
        "Contraseña inválida"
        );

        return;

    }

    // VALIDAR DUPLICADO

    if(existe){

        alert(
        "Ese usuario ya existe"
        );

        return;

    }

    // OBJETO

    const nuevoUsuario = {

        usuario: usuario.value,

        edad: edad.value,

        password: password.value,

        opinion: opinion.value,

        rol:"usuario"

    };


    // MENSAJE

    alert(
    "Registro exitoso"
    );

    // LIMPIAR

    document.getElementById("registroForm")
    .reset();

    // REDIRECCIÓN

    window.location.href = "/";

});

</script>

</body>
</html>
